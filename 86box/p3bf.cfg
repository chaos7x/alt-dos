# 86Box-Obergrenze fuer alt-dos 6.0: ASUS P3B-F, Pentium II, 256 MB, AHA-2944UW
# Persoenliche Pfade, Fensterpositionen, MAC-Adressen, UUID, Host-Angaben,
# Bildlisten und nicht benutzte Kartenreste entfernt. Stand vom Nutzer,
# 15.11.2026. Netzwerk: pcap an einer Host-Schnittstelle (net_01_host_device
# selbst eintragen) oder net_01_net_type = slirp.

[General]
emu_build_num = 10968
force_43 = 1
vid_renderer = qt_vulkan
vid_resize = 1
window_remember = 1

[Machine]
cpu_family = pentium2_deschutes
cpu_multi = 3.5
cpu_speed = 233333333
cpu_use_dynarec = 1
fpu_type = internal
machine = p3bf
mem_size = 262144

[Input devices]
keyboard_type = keyboard_ps2
mouse_type = ps2
tablet_type = none

[Sound]
sndcard = sbawe32

[Sound Blaster AWE32 #1]
onboard_ram = 28672
dspver = 15

[Network]
net_01_card = rtl8139c+
net_01_net_type = pcap
net_01_switch_group = 0

[Video]
gfxcard = trio3d2x_agp

[S3 Trio3D/2X (362) AGP #1]
memory = 8
bilinear = 1
colorkey = 1
dithering = 1

[Storage controllers]
scsicard_1 = aha2944uw

[Adaptec AHA-2944UW #1]
bios = 1

[Hard disks]
hdd_01_fn = Spiele.vhd
hdd_01_parameters = 63, 16, 4158, 0, scsi
hdd_01_scsi_location = 0:01
hdd_01_speed = ramdisk
hdd_01_vhd_blocksize = 1024
hdd_02_fn = OS.vhd
hdd_02_parameters = 63, 16, 1219, 0, scsi
hdd_02_scsi_location = 0:02
hdd_02_speed = ramdisk
hdd_02_vhd_blocksize = 1024
hdd_03_fn = atdos-hd.img
hdd_03_parameters = 63, 16, 130, 0, scsi
hdd_03_scsi_location = 0:00
hdd_03_speed = ramdisk

[Floppy and CD-ROM drives]
cdrom_01_dvd_speed = 10
cdrom_01_parameters = 1, scsi
cdrom_01_scsi_location = 0:06
cdrom_01_speed = 40
cdrom_01_type = 86dvd
fdd_01_turbo = 1
fdd_01_type = 35_2ed
fdd_02_turbo = 1
fdd_02_type = 35_2ed
fdd_host_buffering = 1

[Other removable devices]
rdisk_01_parameters = 2, scsi
rdisk_01_scsi_location = 0:05
