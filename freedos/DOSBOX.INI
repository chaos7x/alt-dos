; DOSBOX.INI - Kompatibilitaetsbox von AT-DOS 5.x
;
; DOS_IMAGE=NAME.IMG unter [*] startet RBOX ohne Angabe mit diesem
; Startabbild statt FREEDOS.IMG (in diesem Verzeichnis, angelegt mit
; MKDOSIMG aus der eigenen DOS-Kopie, z. B. MS-DOS 6.22 oder PC DOS).
; RBOX NAME.IMG startet ein Abbild auch so.

[*]
; DOS_IMAGE=MSDOS.IMG
