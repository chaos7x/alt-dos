; DOSBOX.INI - Einstellungen der DOS-Boxen je Programm (AT-DOS 6.0)
;
; [*] gilt fuer alle Programme, [NAME.EXT] fuer ein Programm (geht vor).
; Wird vor jedem DOS-Programm neu gelesen, Aenderungen gelten sofort.
; Was beim Start der Box gilt, steht in der CONFIG.SYS von AT-DOS:
;   DOS=HIGH,UMB   RMSIZE=640   DOSSTART=SESSION
;
; XMS_MEMORY_LIMIT=KB   XMS je Box, 0 bis 63424 (Vorgabe 2048, -1 = alles)
; EMS_MEMORY_LIMIT=KB   EMS je Box, 0 bis 32768 (Vorgabe 2048, -1 = alles)
;                       0 beim Anlegen der Box: kein EMS-Seitenrahmen,
;                       die 64 KB werden oberer Speicher (UMB)
; EMS_FRAME_LOCATION=NONE  ebenso, EMS bleibt dann ganz aus (wie OS/2)
; DOS_VERSION=n.nn      gemeldete DOS-Version (SETVER.LST geht vor)
; DOS_KERNEL=Datei      DOS der Box (Vorgabe ATDOSCM.SYS, der eigene Kern
;                       von AT-DOS). Endet der Name auf .IMG, startet die
;                       Box ein Startabbild aus diesem Verzeichnis:
;                       FREEDOS.IMG (FreeDOS) oder ein mit MKDOSIMG aus der
;                       eigenen DOS-Kopie angelegtes (z. B. MS-DOS 6.22).
;                       DOS_IMAGE= ist derselbe Schluessel. [COMMAND.COM]
;                       gilt fuer COMMAND/DOSBOX (interaktiv).
; SHARE=OFF             Box wie MS-DOS ohne SHARE: keine Freigabemodi
;                       zwischen den Programmen der Box, eine offene Datei
;                       laesst sich neu anlegen (Vorgabe ON wie mit SHARE)

[*]
XMS_MEMORY_LIMIT=2048
EMS_MEMORY_LIMIT=2048

; Windows-SETUP ueberschreibt Schriften, die Windows gerade geladen hat
[SETUP.EXE]
SHARE=OFF

; Beispiel:
; [ALTSPIEL.EXE]
; DOS_KERNEL=FREEDOS.IMG
; [SPIEL.EXE]
; XMS_MEMORY_LIMIT=0
; DOS_VERSION=5.00
