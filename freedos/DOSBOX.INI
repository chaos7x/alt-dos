; DOSBOX.INI - Einstellungen der DOS-Boxen je Programm (AT-DOS 6.0)
;
; [*] gilt fuer alle Programme, [NAME.EXT] fuer ein Programm (geht vor).
; Wird vor jedem DOS-Programm neu gelesen, Aenderungen gelten sofort.
; Was beim Start der Box gilt, steht in der CONFIG.SYS von AT-DOS:
;   DOS=HIGH,UMB   RMSIZE=640   DOSSTART=SESSION
;
; XMS_MEMORY_LIMIT=KB   XMS je Box, 0 bis 63424 (Vorgabe 2048, -1 = alles)
; EMS_MEMORY_LIMIT=KB   EMS je Box, 0 bis 4096 (Vorgabe 2048)
;                       0 beim Anlegen der Box: kein EMS-Seitenrahmen,
;                       die 64 KB werden oberer Speicher (UMB)
; EMS_FRAME_LOCATION=NONE  ebenso, EMS bleibt dann ganz aus (wie OS/2)
; DOS_VERSION=n.nn      gemeldete DOS-Version (SETVER.LST geht vor)

[*]
XMS_MEMORY_LIMIT=2048
EMS_MEMORY_LIMIT=2048

; Beispiel:
; [SPIEL.EXE]
; XMS_MEMORY_LIMIT=0
; DOS_VERSION=5.00
