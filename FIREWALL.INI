; AT-DOS - Regeln der Firewall von TCPIP.SYS (FIREWALL /LOAD liest sie,
; AUTOEXEC.CMD ruft das beim Start). Je Zeile ein Befehl wie bei
; FIREWALL auf der Befehlszeile; ';' oder REM = Kommentar.
;
; Ohne Regel ist eingehend alles zu ausser Antworten auf eigene Anfragen;
; PING aus dem eigenen Netz geht immer. Ausgehend ist alles frei.
; Lauschen allein oeffnet nichts - erst eine Regel fuer das Programm.
;
; ALLOW Programm Protokoll [Port[-Port]] [FROM Netz/n | LOCAL | ANY]
;   Programm   Name wie in der Titelzeile (z. B. NC.EXE), * = jedes
;   Protokoll  TCP, UDP, ICMP oder ANY
;   FROM       Herkunft; LOCAL = eigenes Netz der Karte, Vorgabe ANY
;
; Beispiele:
; ALLOW NC.EXE TCP 5556 FROM LOCAL
; ALLOW FTPD.EXE TCP 21 FROM 192.168.1.0/24
; ALLOW * ICMP FROM 10.0.0.0/8
; LOG OFF
; OFF
