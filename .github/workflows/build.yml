name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0            # ganze Historie: Build-Nummer fuer VER

      - name: NASM und mtools installieren
        run: sh tools/ci-tools.sh   # apt, sonst aus dem Quelltext

      - name: Open Watcom 2.0 installieren
        run: |
          curl -sSL -o ow.tar.xz \
            https://github.com/open-watcom/open-watcom-v2/releases/download/Current-build/ow-snapshot.tar.xz
          mkdir -p "$HOME/watcom"
          tar -xJf ow.tar.xz -C "$HOME/watcom"
          echo "WATCOM=$HOME/watcom" >> "$GITHUB_ENV"
          echo "INCLUDE=$HOME/watcom/h" >> "$GITHUB_ENV"
          echo "$HOME/watcom/binl64" >> "$GITHUB_PATH"

      - name: Image bauen
        run: ./build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: alt-dos-image
          path: |
            build/dos5.img
            build/atdos-hd.img

      - name: Als Release "latest" veroeffentlichen
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          (cd build && zip -q atdos-hd.zip atdos-hd.img)
          gh release create latest build/dos5.img build/atdos-hd.zip \
            --prerelease \
            --title "Aktueller Stand, Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. dos5.img: Diskette A: in 86Box, beliebige 286-Maschine mit VGA. atdos-hd.zip: startfähige IDE-Platte (130/16/63, im BIOS als Typ User eintragen)."

      - name: Release "v5.1" veroeffentlichen (Zweig 5.x)
        if: github.ref == 'refs/heads/5.x' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd build && zip -q atdos-hd.zip atdos-hd.img)
          BNO=$(sed -n 's/^#define ATDOS_BUILD "\(.*\)"/\1/p' build/version.h)
          gh release delete v5.1 --yes --cleanup-tag 2>/dev/null || true
          gh release create v5.1 build/dos5.img build/atdos-hd.zip \
            --target "$GITHUB_SHA" \
            --title "AT-DOS 5.1, Build $BNO" \
            --notes "AT-DOS 5.1 (Zweig 5.x): 5.0 plus Kompatibilitaetsbox wie OS/2 1.x - FreeDOS im echten Real Mode (RBOX) mit den AT-DOS-Laufwerken als Netzlaufwerke, Tastaturbelegung, Maus (CuteMouse), MEM von FreeDOS, DOS in der HMA (rund 533 KB frei), Alt+Esc hin und zurueck; PROTECTONLY=NO in der CONFIG.SYS laedt die Box schon beim Start. Dazu EDIT bis 512 KB, CONFIG.SYS bis 4 KB. Abbilder: dos5.img (Diskette) und atdos-hd.zip (Platte). Das unveraenderte 5.0 steht im Release v5.0 (Zweig 5.0)."
