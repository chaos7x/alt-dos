name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# je Zweig nur der neueste Lauf: ein spaet startender alter Lauf soll
# 'latest' nicht mit einem aelteren Stand ueberschreiben
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0            # ganze Historie: Build-Nummer fuer VER

      - name: NASM und mtools installieren
        run: sh tools/ci-tools.sh   # apt, sonst aus dem Quelltext

      - name: Open Watcom 2.0 installieren
        run: |
          curl -sSL -o ow.tar.xz \
            https://github.com/open-watcom/open-watcom-v2/releases/download/Current-build/ow-snapshot.tar.xz
          mkdir -p "$HOME/watcom"
          tar -xJf ow.tar.xz -C "$HOME/watcom"
          echo "WATCOM=$HOME/watcom" >> "$GITHUB_ENV"
          echo "INCLUDE=$HOME/watcom/h" >> "$GITHUB_ENV"
          echo "$HOME/watcom/binl64" >> "$GITHUB_PATH"

      - name: Image bauen
        run: ./build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: alt-dos-image
          path: |
            build/atdos-fd.img
            build/atdos-hd.img

      - name: Als Release "latest" veroeffentlichen
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          (cd build && zip -q atdos-hd.zip atdos-hd.img)
          gh release create latest build/atdos-fd.img build/atdos-hd.zip \
            --prerelease \
            --title "Aktueller Stand, Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
            --notes "Weiterarbeit nach AT-DOS 6.0 (Zweig main), automatisch gebaut aus ${GITHUB_SHA::7} (Build ${GITHUB_RUN_NUMBER}, VER zeigt sie). Das fertige 6.0 steht im Release v6.0. Braucht einen 386 (AT-DOS 5.0 für den 286: Release v5.0). atdos-fd.img: Diskette A: in 86Box, 386-Maschine mit VGA. atdos-hd.zip: startfähige IDE-Platte (130/16/63, im BIOS als Typ User eintragen)."

      - name: Release "v6.0" veroeffentlichen (Zweig 6.0)
        if: github.ref == 'refs/heads/6.0' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd build && zip -q atdos-hd.zip atdos-hd.img)
          BNO=$(sed -n 's/^#define ATDOS_BUILD "\(.*\)"/\1/p' build/version.h)
          gh release delete v6.0 --yes --cleanup-tag 2>/dev/null || true
          gh release create v6.0 build/atdos-fd.img build/atdos-hd.zip \
            --target "$GITHUB_SHA" --latest \
            --title "AT-DOS 6.0, Build $BNO" \
            --notes "AT-DOS 6.0 (Zweig 6.0) fuer den 386 und neuer: Paging, praeemptives Multitasking, mehrere DOS-Boxen im V86-Modus (FreeDOS-Kern, XMS, EMS, DPMI, virtuelle VGA/SVGA und Sound Blaster 16 mit AdLib, MPU-401 und AWE-Wavetable, Maus, Umleitung und Pipes), FAT32 mit VFAT und CONVERT, VESA mit linearem Bildspeicher, PCI- und ISA-PnP-Busdienste, SCSI (NCR 53C8xx, Adaptec AIC-7xxx/AHA-2940/2944 mit Trennen, AHA-154x, NCR 5380), IDE mit Busmaster-DMA/UDMA und LBA48, APM, Speicher bis knapp 4 GB, dynamischer Platten-Cache, Sperren je Laufwerk und Geraet, Codepages und Laender, Unicode-Dateinamen, Treiber zur Laufzeit laden und entladen (DEVLOAD), Packprogramme (GZIP, TAR, ZIP, LHA, ARJ, ZOO, 7z). Programme bleiben 16 Bit und laufen auch unter 5.x. Mindestens 386 mit 4 MB (2 MB nur zum Ausprobieren). atdos-fd.img: Diskette A:. atdos-hd.zip: startfaehige IDE-Platte (130/16/63, im BIOS als Typ User eintragen)."
