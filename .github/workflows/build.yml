name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0            # ganze Historie: Build-Nummer fuer VER

      - name: NASM und mtools installieren
        run: sh tools/ci-tools.sh   # apt, sonst aus dem Quelltext

      - name: Open Watcom 2.0 installieren
        run: |
          curl -sSL -o ow.tar.xz \
            https://github.com/open-watcom/open-watcom-v2/releases/download/Current-build/ow-snapshot.tar.xz
          mkdir -p "$HOME/watcom"
          tar -xJf ow.tar.xz -C "$HOME/watcom"
          echo "WATCOM=$HOME/watcom" >> "$GITHUB_ENV"
          echo "INCLUDE=$HOME/watcom/h" >> "$GITHUB_ENV"
          echo "$HOME/watcom/binl64" >> "$GITHUB_PATH"

      - name: Image bauen
        run: ./build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: alt-dos-image
          path: |
            build/dos5*.img
            build/atdos-hd.img

      - name: Als Release "latest" veroeffentlichen
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          (cd build && zip -q atdos-hd.zip atdos-hd.img)
          gh release create latest build/dos5.img build/atdos-hd.zip \
            --prerelease \
            --title "Aktueller Stand, Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. dos5.img: Diskette A: in 86Box, beliebige 286-Maschine mit VGA. atdos-hd.zip: startfähige IDE-Platte (130/16/63, im BIOS als Typ User eintragen)."

      - name: Vorabversion "v5.x" veroeffentlichen (Zweig 5.x)
        if: github.ref == 'refs/heads/5.x' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd build && zip -q atdos-hd.zip atdos-hd.img)
          BNO=$(sed -n 's/^#define ATDOS_BUILD "\(.*\)"/\1/p' build/version.h)
          gh release delete v5.x --yes --cleanup-tag 2>/dev/null || true
          gh release create v5.x build/dos5*.img build/atdos-hd.zip \
            --target "$GITHUB_SHA" --prerelease \
            --title "AT-DOS 5.x nach 5.5 (in Arbeit), Build $BNO" \
            --notes "Weiterarbeit nach 5.5 (Zweig 5.x). Setup-Disketten: dos5.img (startfaehig, SETUP), dos5-2.img ff. Das fertige 5.5 steht im Release v5.5 (Zweig 5.5), 5.4 in v5.4, 5.3.2 in v5.3.2, 5.3.1 in v5.3.1, 5.3 in v5.3, 5.2 in v5.2, 5.1 in v5.1, 5.0 in v5.0."

      - name: Release "v5.2" veroeffentlichen (Zweig 5.2)
        if: github.ref == 'refs/heads/5.2' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd build && zip -q atdos-hd.zip atdos-hd.img)
          BNO=$(sed -n 's/^#define ATDOS_BUILD "\(.*\)"/\1/p' build/version.h)
          gh release delete v5.2 --yes --cleanup-tag 2>/dev/null || true
          gh release create v5.2 build/dos5.img build/atdos-hd.zip \
            --target "$GITHUB_SHA" \
            --title "AT-DOS 5.2, Build $BNO" \
            --notes "AT-DOS 5.2 (Zweig 5.2): 5.1 plus Rueckportierungen aus 6.0 - Laender und Codepages (COUNTRY=, CODEPAGE=, CHCP, KEYB mit Codepage), Unicode-Dateinamen, RBOX mit XMS, DOSKEY-Makros, DIRCMD, Laufzeit wie uptime, AWE32/64-Wavetable mit AWELOAD, EJECT, gebundene Werkzeuge (XCOPY, MOVE, DELTREE, MSD ...) auch unter DOS und in RBOX, kommentierte CONFIG.SYS. dos5.img: Diskette A:, 286 mit VGA. atdos-hd.zip: startfaehige IDE-Platte (130/16/63, Typ User)."

      - name: Release "v5.3" veroeffentlichen (Zweig 5.3)
        if: github.ref == 'refs/heads/5.3' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd build && zip -q atdos-hd.zip atdos-hd.img)
          BNO=$(sed -n 's/^#define ATDOS_BUILD "\(.*\)"/\1/p' build/version.h)
          gh release delete v5.3 --yes --cleanup-tag 2>/dev/null || true
          gh release create v5.3 build/dos5.img build/atdos-hd.zip \
            --target "$GITHUB_SHA" \
            --title "AT-DOS 5.3, Build $BNO" \
            --notes "AT-DOS 5.3 (Zweig 5.3): 5.1 plus Rueckportierungen aus 6.0 - Packprogramme GZIP/GUNZIP, TAR, ZIP/UNZIP, LHA/ARJ/ZOO (+ UNLHA/UNARJ/UNZOO), 7ZA/7ZDEC, CAT, LINUX.MAC; Laender und Codepages (COUNTRY=, CODEPAGE=, CHCP, KEYB mit Codepage), Unicode-Dateinamen, RBOX mit XMS, DOSKEY-Makros, DIRCMD, Laufzeit wie uptime, AWE32/64-Wavetable mit AWELOAD, EJECT, gebundene Werkzeuge (XCOPY, MOVE, DELTREE, MSD ...) auch unter DOS und in RBOX, kommentierte CONFIG.SYS. dos5.img: Diskette A:, 286 mit VGA. atdos-hd.zip: startfaehige IDE-Platte (130/16/63, Typ User)."

      - name: Release "v5.3.1" veroeffentlichen (Zweig 5.3.1)
        if: github.ref == 'refs/heads/5.3.1' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd build && zip -q atdos-hd.zip atdos-hd.img)
          BNO=$(sed -n 's/^#define ATDOS_BUILD "\(.*\)"/\1/p' build/version.h)
          gh release delete v5.3.1 --yes --cleanup-tag 2>/dev/null || true
          gh release create v5.3.1 build/dos5.img build/atdos-hd.zip \
            --target "$GITHUB_SHA" --latest=false \
            --title "AT-DOS 5.3.1, Build $BNO" \
            --notes "AT-DOS 5.3.1 (Zweig 5.3.1): Fehlerbehebungen fuer 5.3 - Treiber ohne Geraet gaben ihren Speicher nicht frei (Treiberlader), EJECT setzt vorher das Sauber-Bit (kein AUTOCHECK nach dem Wiedereinlegen), leere Wechselplatte heisst beim Start Wechselplatte, kein Medium, DIR mit /O (Sortierung), DIRCMD, /? und Meldung bei unbekannten Schaltern wie in 6.0 (vorher galten sie als Dateimuster - Datei nicht gefunden). Sonst wie 5.3. dos5.img: Diskette A:, 286 mit VGA. atdos-hd.zip: startfaehige IDE-Platte (130/16/63, Typ User)."

      - name: Release "v5.3.2" veroeffentlichen (Zweig 5.3.2)
        if: github.ref == 'refs/heads/5.3.2' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd build && zip -q atdos-hd.zip atdos-hd.img)
          BNO=$(sed -n 's/^#define ATDOS_BUILD "\(.*\)"/\1/p' build/version.h)
          gh release delete v5.3.2 --yes --cleanup-tag 2>/dev/null || true
          gh release create v5.3.2 build/dos5.img build/atdos-hd.zip \
            --target "$GITHUB_SHA" --latest=false \
            --title "AT-DOS 5.3.2, Build $BNO" \
            --notes "AT-DOS 5.3.2 (Zweig 5.3.2) fuer den 286: 5.3.1 plus DIR /S aus 6.0 (Unterverzeichnisse, mit /B volle Pfade). Enthaelt die Fehlerbehebungen von 5.3.1 (Treiberlader, EJECT mit Sauber-Bit, Wechselplatte ohne Medium, DIR /O und /?). dos5.img: Diskette A:, 286 mit VGA. atdos-hd.zip: startfaehige IDE-Platte (130/16/63, Typ User). Fuer den 386: AT-DOS 6.0 (Release v6.0)."

      - name: Release "v5.4" veroeffentlichen (Zweig 5.4)
        if: github.ref == 'refs/heads/5.4' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd build && zip -q atdos-hd.zip atdos-hd.img)
          BNO=$(sed -n 's/^#define ATDOS_BUILD "\(.*\)"/\1/p' build/version.h)
          gh release delete v5.4 --yes --cleanup-tag 2>/dev/null || true
          gh release create v5.4 build/dos5.img build/atdos-hd.zip \
            --target "$GITHUB_SHA" --latest=false \
            --title "AT-DOS 5.4, Build $BNO" \
            --notes "AT-DOS 5.4 (Zweig 5.4) fuer den 286: 5.3.2 plus Rueckportierungen aus 6.1 - Speicher wie OS/2 1.x (Programmcode bei Speichermangel verwerfen und aus der EXE nachladen, Datensegmente verschieben, mit SWAPPATH= in SWAPPER.DAT auslagern; MEMMAN=NOSWAP), LOOP (ISO, Disketten-/Plattenabbilder, VHD, DoubleSpace/DriveSpace lesen und schreiben, LOOP=), PACKDISK, DEVLOAD (Treiber laden und entladen), DMESG, STRINGS, MD5SUM/SHA1SUM, HEXDUMP/XXD, schnellere Maussuche. dos5.img: Diskette A:, 286 mit VGA. atdos-hd.zip: startfaehige IDE-Platte (130/16/63, Typ User). Fuer den 386: AT-DOS 6.x."

      - name: Release "v5.5" veroeffentlichen (Zweig 5.5)
        if: github.ref == 'refs/heads/5.5' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd build && zip -q atdos-hd.zip atdos-hd.img)
          BNO=$(sed -n 's/^#define ATDOS_BUILD "\(.*\)"/\1/p' build/version.h)
          gh release delete test-5.5 --yes --cleanup-tag 2>/dev/null || true
          gh release delete v5.5 --yes --cleanup-tag 2>/dev/null || true
          gh release create v5.5 build/dos5.img build/atdos-hd.zip \
            --target "$GITHUB_SHA" --latest=false \
            --title "AT-DOS 5.5, Build $BNO" \
            --notes "AT-DOS 5.5 (Zweig 5.5) fuer den 286 = 5.4 plus Netzwerk aus 6.2: NE2000.SYS, TCPIP.SYS (IPv4/IPv6, TCP, UDP, DHCP, DNS, Firewall), PING, IPCONFIG, NSLOOKUP, NC, NETSTAT, FIREWALL, WGET, FTP, TELNET, SNTP (nur auf der Festplatte), DETACH ohne Konsole, XCOPY /I, F8 beim Start, CONFIG.SYS bis 8 KB; Kompatibilitaetsbox: PATH/SET/PROMPT aus AUTOEXEC.BAT, BLASTER, MSCDEX, A20 wie HIMEM (EXEPACK), Redirector auch in EMS-Rahmen/UMB/HMA (Lotus Works mit LTEMM). dos5.img: Diskette A:, 286 mit VGA. atdos-hd.zip: startfaehige IDE-Platte (130/16/63, Typ User). Fuer den 386: AT-DOS 6.x."
