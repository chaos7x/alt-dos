name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0            # ganze Historie: Build-Nummer fuer VER

      - name: NASM und mtools installieren
        run: sh tools/ci-tools.sh   # apt, sonst aus dem Quelltext

      - name: Open Watcom 2.0 installieren
        run: |
          curl -sSL -o ow.tar.xz \
            https://github.com/open-watcom/open-watcom-v2/releases/download/Current-build/ow-snapshot.tar.xz
          mkdir -p "$HOME/watcom"
          tar -xJf ow.tar.xz -C "$HOME/watcom"
          echo "WATCOM=$HOME/watcom" >> "$GITHUB_ENV"
          echo "INCLUDE=$HOME/watcom/h" >> "$GITHUB_ENV"
          echo "$HOME/watcom/binl64" >> "$GITHUB_PATH"

      - name: Image bauen
        run: ./build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: alt-dos-image
          path: |
            build/dos5.img
            build/atdos-hd.img

      - name: Als Release "latest" veroeffentlichen
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          (cd build && zip -q atdos-hd.zip atdos-hd.img)
          gh release create latest build/dos5.img build/atdos-hd.zip \
            --prerelease \
            --title "Aktueller Stand, Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. dos5.img: Diskette A: in 86Box, beliebige 286-Maschine mit VGA. atdos-hd.zip: startfähige IDE-Platte (130/16/63, im BIOS als Typ User eintragen)."

      - name: Release "v5.0" veroeffentlichen (Zweig 5.0)
        if: github.ref == 'refs/heads/5.0' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd build && zip -q atdos-hd.zip atdos-hd.img)
          if gh release view v5.0 >/dev/null 2>&1; then
            gh release upload v5.0 build/dos5.img build/atdos-hd.zip --clobber
            BNO=$(sed -n 's/^#define ATDOS_BUILD "\(.*\)"/\1/p' build/version.h)
            gh release edit v5.0 --title "AT-DOS 5.0, Build $BNO"
          else
            gh release create v5.0 build/dos5.img build/atdos-hd.zip \
              --target "$GITHUB_SHA" \
              --title "AT-DOS 5.0" \
              --notes "AT-DOS 5.0 (Meilenstein 9): 80286 Protected Mode, kooperatives Multitasking, FAPI. Lange Namen, Platten-Cache im Kernel, Stapelsprache wie MS-DOS 6.22/OS/2, Dateimanager FM, EDIT, LESS, GREP und Textwerkzeuge nach GNU, 287 je Task, Joliet-CDs, gemeinsame Codesegmente, FAPI-Programme auch unter MS-DOS, Ton (SB16.SYS: Sound Blaster 1.0 bis AWE, FM-Synthese, MPU-401; PLAY, MIXER). dos5.img: startfaehige Diskette (1,44 MB), beliebige 286-Maschine mit VGA. atdos-hd.zip: startfaehige IDE-Platte (130/16/63, im BIOS als Typ User eintragen). Lizenz GPL-2.0-or-later."
          fi
