name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# je Zweig nur der neueste Lauf: ein spaet startender alter Lauf soll
# 'latest' nicht mit einem aelteren Stand ueberschreiben
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0            # ganze Historie: Build-Nummer fuer VER

      - name: NASM und mtools installieren
        run: sh tools/ci-tools.sh   # apt, sonst aus dem Quelltext

      - name: Open Watcom 2.0 installieren
        run: |
          curl -sSL -o ow.tar.xz \
            https://github.com/open-watcom/open-watcom-v2/releases/download/Current-build/ow-snapshot.tar.xz
          mkdir -p "$HOME/watcom"
          tar -xJf ow.tar.xz -C "$HOME/watcom"
          echo "WATCOM=$HOME/watcom" >> "$GITHUB_ENV"
          echo "INCLUDE=$HOME/watcom/h" >> "$GITHUB_ENV"
          echo "$HOME/watcom/binl64" >> "$GITHUB_PATH"

      - name: Image bauen
        run: ./build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: alt-dos-image
          path: |
            build/atdos-fd.img
            build/atdos-fd2.img
            build/atdos-fd3.img
            build/atdos-hd.img

      - name: Als Release "latest" veroeffentlichen
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          (cd build && zip -q atdos-hd.zip atdos-hd.img)
          gh release create latest build/atdos-fd.img build/atdos-fd2.img build/atdos-fd3.img build/atdos-hd.zip \
            --prerelease \
            --title "Aktueller Stand, Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
            --notes "Weiterarbeit nach AT-DOS 6.3 (Zweig main), automatisch gebaut aus ${GITHUB_SHA::7} (Build ${GITHUB_RUN_NUMBER}, VER zeigt sie). das fertige 6.3 im Release v6.3, 6.2 in v6.2, 6.1 in v6.1, 6.0 in v6.0. Braucht einen 386 (AT-DOS 5.0 für den 286: Release v5.0). atdos-fd.img: Setup-Diskette 1 (startfähig, Notfalldiskette, SETUP richtet AT-DOS auf der Festplatte ein), atdos-fd2.img: Setup-Diskette 2 (DOS-Box, Packprogramme, Zeichensätze, Demos), atdos-fd3.img: Setup-Diskette 3 (COMMAND.COM 4.0 für die DOS-Box). atdos-hd.zip: startfähige IDE-Platte (130/16/63, im BIOS als Typ User eintragen)."

      - name: Release "v6.3" veroeffentlichen (Zweig 6.3)
        if: github.ref == 'refs/heads/6.3' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd build && zip -q atdos-hd.zip atdos-hd.img)
          BNO=$(sed -n 's/^#define ATDOS_BUILD "\(.*\)"/\1/p' build/version.h)
          gh release delete test-6.3 --yes --cleanup-tag 2>/dev/null || true
          gh release delete v6.3 --yes --cleanup-tag 2>/dev/null || true
          gh release create v6.3 build/atdos-fd.img build/atdos-fd2.img build/atdos-hd.zip \
            --target "$GITHUB_SHA" --latest \
            --title "AT-DOS 6.3, Build $BNO" \
            --notes "AT-DOS 6.3 (Zweig 6.3) fuer den 386 und neuer = 6.2 plus: Module fuer die DOS-Box wie die VDDs von OS/2 (VCOM, VSB, VEMS, VEGA/VCGA, VMOUSE in \\DOS\\SYSTEM), VirtIO (VIOBLK, VIONET), TLS 1.2 mit Zertifikatspruefung (WGET https), SSH und SFTP, SMB-Client (SMBCLI, NET USE mit Wiederverbinden, Sperren und Freigabemodi beim Server), Domaene (KINIT/KLIST, DOMJOIN, LOGON, Ausweichen auf andere DCs, SRV), HOSTS/HOSTNAME, AUTOEXEC.BAT in der DOS-Box, Strg+C an der Eingabezeile, freier Platz ueber 4 GB, DEM als eigener Teil (Vorstufe des eigenen Box-Kerns). Mindestens 386 mit 4 MB. atdos-fd.img/atdos-fd2.img: Setup-Disketten 1 und 2. atdos-hd.zip: startfaehige IDE-Platte (130/16/63, im BIOS als Typ User eintragen)."

      - name: Release "v6.2" veroeffentlichen (Zweig 6.2)
        if: github.ref == 'refs/heads/6.2' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd build && zip -q atdos-hd.zip atdos-hd.img)
          BNO=$(sed -n 's/^#define ATDOS_BUILD "\(.*\)"/\1/p' build/version.h)
          gh release delete test-6.2 --yes --cleanup-tag 2>/dev/null || true
          gh release delete v6.2 --yes --cleanup-tag 2>/dev/null || true
          gh release create v6.2 build/atdos-fd.img build/atdos-fd2.img build/atdos-hd.zip \
            --target "$GITHUB_SHA" --latest=false \
            --title "AT-DOS 6.2, Build $BNO" \
            --notes "AT-DOS 6.2 (Zweig 6.2) fuer den 386 und neuer = 6.1 plus Netzwerk: TCP/IP mit IPv6 (SLAAC, globale und lokale Adresse) und Firewall (TCPIP.SYS), Karten NE2000, RTL8139, PCnet, e1000, Werkzeuge PING, IPCONFIG, NSLOOKUP, NC, NETSTAT, FIREWALL, WGET, FTP, TELNET, SNTP; Sperren je Laufwerk auch fuer CD-Dateisysteme, acht Loop-Laufwerke, DETACH ohne Konsole, XCOPY /I, CONFIG.SYS bis 8 KB, F8 beim Start (CONFIG.SYS und AUTOEXEC.CMD schrittweise). Mindestens 386 mit 4 MB. atdos-fd.img/atdos-fd2.img: Setup-Disketten 1 und 2. atdos-hd.zip: startfaehige IDE-Platte (130/16/63, im BIOS als Typ User eintragen)."

      - name: Release "v6.1" veroeffentlichen (Zweig 6.1)
        if: github.ref == 'refs/heads/6.1' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd build && zip -q atdos-hd.zip atdos-hd.img)
          BNO=$(sed -n 's/^#define ATDOS_BUILD "\(.*\)"/\1/p' build/version.h)
          gh release delete v6.1 --yes --cleanup-tag 2>/dev/null || true
          gh release create v6.1 build/atdos-fd.img build/atdos-fd2.img build/atdos-hd.zip \
            --target "$GITHUB_SHA" --latest=false \
            --title "AT-DOS 6.1, Build $BNO" \
            --notes "AT-DOS 6.1 (Zweig 6.1) fuer den 386 und neuer = 6.0 plus: Installation von zwei Setup-Disketten (SETUP, FDISK/FORMAT wie MS-DOS), Speicher wie OS/2 1.x (Code verwerfen und nachladen, Segmente verschieben, Auslagerungsdatei SWAPPER.DAT fuer Programme und DOS-Boxen), Loop-Laufwerke (ISO, IMG, VHD; LOOP=), DoubleSpace/DriveSpace 6 und DriveSpace 3 lesen und schreiben mit PACKDISK (/CREATE, /COMPRESS, /CHECK), FAT32 -> FAT16 mit CONVERT (auch beim Neustart), MSCDEX in der DOS-Box, AHCI (SATA) und Ausschalten ueber ACPI fuer VMs, DMESG, Werkzeuge (STRINGS, MD5SUM/SHA1SUM, HEXDUMP/XXD). Mindestens 386 mit 4 MB (2 MB nur zum Ausprobieren). atdos-fd.img/atdos-fd2.img: Setup-Disketten 1 und 2. atdos-hd.zip: startfaehige IDE-Platte (130/16/63, im BIOS als Typ User eintragen)."

      - name: Release "v6.0" veroeffentlichen (Zweig 6.0)
        if: github.ref == 'refs/heads/6.0' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd build && zip -q atdos-hd.zip atdos-hd.img)
          BNO=$(sed -n 's/^#define ATDOS_BUILD "\(.*\)"/\1/p' build/version.h)
          gh release delete v6.0 --yes --cleanup-tag 2>/dev/null || true
          gh release create v6.0 build/atdos-fd.img build/atdos-hd.zip \
            --target "$GITHUB_SHA" --latest=false \
            --title "AT-DOS 6.0, Build $BNO" \
            --notes "AT-DOS 6.0 (Zweig 6.0) fuer den 386 und neuer: Paging, praeemptives Multitasking, mehrere DOS-Boxen im V86-Modus (FreeDOS-Kern, XMS, EMS, DPMI, virtuelle VGA/SVGA und Sound Blaster 16 mit AdLib, MPU-401 und AWE-Wavetable, Maus, Umleitung und Pipes), FAT32 mit VFAT und CONVERT, VESA mit linearem Bildspeicher, PCI- und ISA-PnP-Busdienste, SCSI (NCR 53C8xx, Adaptec AIC-7xxx/AHA-2940/2944 mit Trennen, AHA-154x, NCR 5380), IDE mit Busmaster-DMA/UDMA und LBA48, APM, Speicher bis knapp 4 GB, dynamischer Platten-Cache, Sperren je Laufwerk und Geraet, Codepages und Laender, Unicode-Dateinamen, Treiber zur Laufzeit laden und entladen (DEVLOAD), Packprogramme (GZIP, TAR, ZIP, LHA, ARJ, ZOO, 7z). Programme bleiben 16 Bit und laufen auch unter 5.x. Mindestens 386 mit 4 MB (2 MB nur zum Ausprobieren). atdos-fd.img: Diskette A:. atdos-hd.zip: startfaehige IDE-Platte (130/16/63, im BIOS als Typ User eintragen)."
